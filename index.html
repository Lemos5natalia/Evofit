<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#6d28d9"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>Evofit</title><style>
:root{--purple:#6d28d9;--pale:#ede9fe;--bg:#f8f7fc;--ink:#26213a;--muted:#77728a;--line:#e5e0ef}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#6d28d9,#a78bfa);color:white;padding:22px 18px 18px;border-radius:0 0 24px 24px}header h1{margin:0;font-size:26px}header p{margin:5px 0 0;opacity:.9}.nav{display:flex;overflow:auto;gap:8px;padding:12px;position:sticky;top:0;background:var(--bg);z-index:3}.nav button{border:0;border-radius:18px;padding:10px 13px;background:#eee9f8;color:var(--purple);white-space:nowrap;font-weight:700}.nav button.active{background:var(--purple);color:white}main{padding:12px;max-width:850px;margin:auto}.panel{background:white;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 2px 12px #25184a0c}.panel h2{margin:0 0 10px;font-size:19px}.small{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.metric{background:#f3effc;padding:14px;border-radius:14px}.metric b{display:block;font-size:22px}.btn{border:0;border-radius:12px;padding:11px 14px;background:var(--purple);color:white;font-weight:700;cursor:pointer}.btn.secondary{background:#eee9f8;color:var(--purple)}.btn.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.exercise{border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0}.exercise h3{margin:0 0 5px}.inputgrid{display:grid;grid-template-columns:repeat(3,minmax(70px,1fr));gap:7px}.inputgrid label,form label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink);margin-top:4px}textarea{min-height:60px}.setrow{display:grid;grid-template-columns:28px 1fr 1fr 1fr;gap:6px;align-items:center;margin:7px 0}.setrow span{font-size:12px;color:var(--muted)}.hide{display:none!important}.tabs{display:flex;gap:8px;flex-wrap:wrap}.exercise select{margin:8px 0}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{padding:8px 2px;text-align:center;border-radius:9px;background:#f2eff8;font-size:12px}.day.done{background:#ddd6fe;color:#5b21b6;font-weight:700}.day.today{outline:2px solid var(--purple)}canvas{max-width:100%}ul{padding-left:20px}footer{text-align:center;padding:22px;color:var(--muted);font-size:12px}#timer{font-size:32px;text-align:center;font-weight:800;color:var(--purple)}</style></head><body>
<header><h1>💜 Evofit</h1><p>Seu diário de evolução e treino</p></header><nav class="nav" id="nav"></nav><main id="app"></main><footer>Evofit • Seus registros ficam neste navegador/dispositivo. Faça backups e evite registrar dados sensíveis.</footer>
<script>
const routines={A:{title:'Quadríceps + Panturrilha',items:[['Agachamento livre',4,10,['Agachamento sumô','Agachamento no Smith','Agachamento goblet','Hack squat']],['Leg press 45°',4,12,['Leg press horizontal','Leg press unilateral','Hack squat']],['Cadeira extensora',3,15,['Extensora unilateral','Extensora com pausa']],['Afundo',3,10,['Passada caminhando','Afundo no Smith','Afundo com halteres','Agachamento búlgaro']],['Panturrilha em pé',4,15,['Panturrilha no leg press','Panturrilha no Smith','Panturrilha unilateral']]]},B:{title:'Costas + Peito + Bíceps',items:[['Puxada alta',3,12,['Puxada frente aberta','Puxada neutra','Puxada supinada']],['Remada baixa',3,12,['Remada unilateral','Remada articulada','Remada cavalinho']],['Remada curvada',3,10,['Remada com halteres','Remada no Smith']],['Supino reto',3,10,['Supino com halteres','Máquina convergente']],['Supino inclinado',3,10,['Supino inclinado com halteres','Supino inclinado máquina']],['Crucifixo',3,12,['Crucifixo máquina','Crucifixo com halteres']],['Rosca direta',3,12,['Rosca barra W','Rosca com halteres']],['Rosca martelo',3,12,['Martelo alternado','Martelo na corda']]]},C:{title:'Glúteos + Posteriores',items:[['Hip thrust',4,10,['Elevação pélvica no Smith','Hip thrust máquina']],['Agachamento sumô',3,12,['Sumô com halter','Sumô com barra']],['Stiff',3,10,['Stiff com halteres','Stiff com barra']],['Mesa flexora',3,12,['Flexora unilateral','Flexora em pé']],['Cadeira flexora',3,12,['Flexora deitada','Flexora unilateral']],['Búlgaro (foco glúteo)',3,10,['Afundo longo','Passada longa']],['Abdutora',3,15,['Abdutora inclinada','Abdução com polia']],['Coice na polia',3,12,['Coice com caneleira','Extensão de quadril na máquina']]]},D:{title:'Ombros + Costas + Tríceps',items:[['Desenvolvimento',3,10,['Desenvolvimento com halteres','Desenvolvimento máquina']],['Elevação lateral',3,12,['Elevação lateral na polia','Elevação lateral máquina']],['Elevação frontal',3,12,['Elevação frontal com barra','Elevação frontal na polia']],['Face pull',3,15,['Crucifixo inverso máquina','Crucifixo inverso na polia']],['Puxada alta',3,12,['Puxada neutra','Puxada unilateral']],['Tríceps corda',3,12,['Tríceps barra','Tríceps unilateral na polia']],['Tríceps francês',3,12,['Francês unilateral','Halter acima da cabeça']],['Tríceps testa',3,12,['Testa com barra W','Testa com halteres']]]},E:{title:'Cardio + Abdômen',items:[['Cardio (minutos)',1,30,['Esteira caminhada inclinada','Corrida leve','Bicicleta','Escada']],['Crunch abdominal',3,15,['Crunch máquina','Abdominal na polia']],['Elevação de pernas',3,12,['Elevação de joelhos','Elevação na barra']],['Prancha (segundos)',3,30,['Prancha lateral','Prancha com variação']]]}};
let page='home', selected='A', savedWorkout=null;const app=document.getElementById('app'),nav=document.getElementById('nav');let timerSecs=0,timerInterval;
function records(){return JSON.parse(localStorage.getItem('fitnessEntries')||'[]')}function logs(){return JSON.parse(localStorage.getItem('evofitWorkouts')||'[]')}function fmtDate(d){return d.toISOString().slice(0,10)}function go(p){page=p;render()}function menu(){let names={home:'Início',measures:'Medidas',workout:'Treinos',history:'Histórico',progress:'Evolução'};nav.innerHTML=Object.entries(names).map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('')}
function render(){menu();if(page==='home')home();else if(page==='measures')measure();else if(page==='workout')workout();else if(page==='history')historyPage();else progress()}
function home(){let m=records(),w=logs(),last=m.at(-1)||{};let date=new Date(),firstDay=new Date(date.getFullYear(),date.getMonth(),1),days=new Date(date.getFullYear(),date.getMonth()+1,0).getDate(),start=firstDay.getDay();let trained=new Set(w.filter(x=>x.date.startsWith(date.toISOString().slice(0,7))).map(x=>+x.date.slice(8)));app.innerHTML=`<div class="panel"><h2>Seu painel</h2><div class="grid"><div class="metric"><span class="small">Peso atual</span><b>${last.weight||'—'} kg</b></div><div class="metric"><span class="small">Cintura</span><b>${last.waist||'—'} cm</b></div><div class="metric"><span class="small">Glúteos</span><b>${last.glute||'—'} cm</b></div><div class="metric"><span class="small">Coxa</span><b>${last.thigh||'—'} cm</b></div></div><p><button class="btn" onclick="go('measures')">+ Registrar medidas</button></p></div><div class="panel"><h2>Calendário • ${date.toLocaleString('pt-BR',{month:'long',year:'numeric'})}</h2><div class="calendar">${['D','S','T','Q','Q','S','S'].map(x=>`<div class="day">${x}</div>`).join('')}${Array(start).fill('<div></div>').join('')}${Array.from({length:days},(_,i)=>`<div class="day ${trained.has(i+1)?'done':''} ${i+1===date.getDate()?'today':''}">${i+1}${trained.has(i+1)?' ✓':''}</div>`).join('')}</div><p class="small">${w.length} treino(s) registrados • ${w.filter(x=>x.date.slice(0,7)===fmtDate(date).slice(0,7)).length} neste mês</p></div><div class="panel"><h2>Conquistas</h2><div class="grid">${[1,5,10,25].map(n=>`<div class="metric">${w.length>=n?'🏆':'🔒'} <b>${n} treino${n>1?'s':''}</b><span class="small">${w.length>=n?'Conquistado':'Meta'}</span></div>`).join('')}</div></div><div class="panel"><h2>Vamos treinar?</h2><button class="btn" onclick="go('workout')">Abrir ficha do dia</button></div>`}
function measure(){app.innerHTML=`<div class="panel"><h2>Registrar medidas</h2><form id="mf"><div class="grid">${[['weight','Peso (kg)'],['waist','Cintura (cm)'],['glute','Glúteos (cm)'],['thigh','Coxa (cm)'],['chest','Peito (cm)'],['arm','Braço (cm)']].map(([k,l])=>`<label>${l}<input type="number" step="0.1" name="${k}" placeholder="0"></label>`).join('')}</div><label>Data<input type="date" name="date" value="${fmtDate(new Date())}"></label><p><button class="btn">Salvar medidas</button></p></form></div>`;document.getElementById('mf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),obj={date:f.get('date')};['weight','waist','glute','thigh','chest','arm'].forEach(k=>{if(f.get(k))obj[k]=f.get(k)});let a=records();a.push(obj);a.sort((x,y)=>x.date.localeCompare(y.date));localStorage.setItem('fitnessEntries',JSON.stringify(a));go('home')}}
function workout(){let w=routines[selected];app.innerHTML=`<div class="panel"><h2>Diário de treino</h2><label>Escolha sua ficha</label><div class="tabs">${Object.keys(routines).map(k=>`<button class="btn ${selected===k?'':'secondary'}" onclick="selected='${k}';workout()">${k}</button>`).join('')}</div><h2>${selected} • ${w.title}</h2><label>Data<input id="wdate" type="date" value="${fmtDate(new Date())}"></label><label>Observações gerais<textarea id="wobs" placeholder="Como foi seu treino?"></textarea></label></div>${w.items.map((item,i)=>exerciseCard(item,i)).join('')}<div class="panel"><h2>Descanso</h2><div id="timer">01:30</div><div class="row"><button class="btn secondary" onclick="startTimer(60)">60 s</button><button class="btn secondary" onclick="startTimer(90)">90 s</button><button class="btn secondary" onclick="startTimer(120)">120 s</button><button class="btn" onclick="startTimer(0)">Parar</button></div></div><div class="panel"><button class="btn" style="width:100%" onclick="saveWorkout()">Salvar treino</button></div>`}
function exerciseCard(item,i){let [name,sets,reps,alts]=item;return `<div class="panel exercise" id="ex${i}"><h3>${name}</h3><label>Alternativa (opcional)<select id="alt${i}" onchange="if(this.value)document.querySelector('#ex${i} h3').innerText=this.value"><option value="">Exercício-base</option>${alts.map(a=>`<option>${a}</option>`).join('')}</select></label><p class="small">${sets} série(s) • ${reps} repetições (sugestão)</p>${Array.from({length:sets},(_,j)=>`<div class="setrow"><span>S${j+1}</span><label>Carga<input type="number" step="0.5" placeholder="kg" id="load${i}_${j}"></label><label>Reps<input type="number" placeholder="${reps}" id="rep${i}_${j}"></label><label>Tempo<input placeholder="s/min" id="time${i}_${j}"></label></div>`).join('')}<label>Observação<input id="note${i}" placeholder="Opcional"></label><label><input style="width:auto" type="checkbox" id="done${i}"> Exercício concluído</label></div>`}
function saveWorkout(){let w=routines[selected],items=w.items.map((it,i)=>{let name=document.querySelector(`#ex${i} h3`).innerText,sets=Array.from({length:it[1]},(_,j)=>({load:document.getElementById(`load${i}_${j}`).value,reps:document.getElementById(`rep${i}_${j}`).value,time:document.getElementById(`time${i}_${j}`).value}));return{name,sets,note:document.getElementById(`note${i}`).value,done:document.getElementById(`done${i}`).checked}});let entry={date:document.getElementById('wdate').value,type:selected,title:w.title,items,notes:document.getElementById('wobs').value};let l=logs();l.push(entry);localStorage.setItem('evofitWorkouts',JSON.stringify(l));alert('Treino salvo! 💜');go('home')}
function startTimer(s){clearInterval(timerInterval);timerSecs=s;displayTimer();if(s>0)timerInterval=setInterval(()=>{timerSecs--;displayTimer();if(timerSecs<=0){clearInterval(timerInterval);if(navigator.vibrate)navigator.vibrate(300)}},1000)}function displayTimer(){let el=document.getElementById('timer');if(el)el.textContent=String(Math.floor(timerSecs/60)).padStart(2,'0')+':'+String(timerSecs%60).padStart(2,'0')}
function historyPage(){let l=logs().slice().reverse();app.innerHTML=`<div class="panel"><h2>Histórico de treinos</h2>${l.length?l.map(x=>`<div class="exercise"><b>${x.date} • Treino ${x.type}</b><div class="small">${x.title}</div>${x.items.map(it=>`<p><b>${it.name}</b> ${it.done?'✓':''}<br>${it.sets.map((s,i)=>`S${i+1}: ${s.load||'—'} kg × ${s.reps||'—'} ${s.time?` • ${s.time}`:''}`).join(' | ')}${it.note?`<br><span class="small">${it.note}</span>`:''}</p>`).join('')}<p class="small">${x.notes||''}</p></div>`).join(''):'<p class="small">Ainda não há treinos registrados.</p>'}</div><div class="panel"><button class="btn danger" onclick="exportData()">Exportar backup JSON</button></div>`}
function progress(){let l=logs(),ex={};l.forEach(x=>x.items.forEach(it=>it.sets.forEach(s=>{if(s.load){ex[it.name]??=[];ex[it.name].push({date:x.date,load:+s.load,reps:+s.reps||0})}})));let m=records();app.innerHTML=`<div class="panel"><h2>Comparação de medidas</h2>${m.length>=2?`<div class="grid">${['weight','waist','glute','thigh'].map(k=>{let a=m[0][k],b=m.at(-1)[k];return a&&b?`<div class="metric"><span class="small">${k==='weight'?'Peso':k==='waist'?'Cintura':k==='glute'?'Glúteos':'Coxa'}</span><b>${a} → ${b}</b><span>${(+b-(+a)).toFixed(1)}</span></div>`:''}).join('')}</div>`:'<p class="small">Registre duas medições para comparar sua evolução.</p>'}</div><div class="panel"><h2>Evolução de cargas</h2><label>Exercício<select id="expick"><option value="">Selecione</option>${Object.keys(ex).map(k=>`<option>${k}</option>`).join('')}</select></label><div id="chart"></div></div><div class="panel"><h2>Medidas registradas</h2>${m.map(x=>`<div class="exercise"><b>${x.date}</b><p class="small">Peso: ${x.weight||'—'} • Cintura: ${x.waist||'—'} • Glúteos: ${x.glute||'—'} • Coxa: ${x.thigh||'—'}</p></div>`).join('')}</div>`;document.getElementById('expick').onchange=e=>{let arr=ex[e.target.value]||[],chart=document.getElementById('chart');chart.innerHTML=arr.map(a=>`<div class="metric" style="margin:6px 0"><b>${a.load} kg • ${a.reps||'—'} reps</b><span class="small">${a.date}</span></div>`).join('')||'Sem registros'}}
function exportData(){let data={measurements:records(),workouts:logs()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='evofit-backup.json';a.click();URL.revokeObjectURL(url)}render();
</script></body></html>
